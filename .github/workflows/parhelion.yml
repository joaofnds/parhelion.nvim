---
name: Parhelion
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: false
      - run: make format-check

  suite:
    name: Test suite on Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        neovim:
          - v0.12.6
          - nightly
    env:
      PARHELION_NEOVIM: ${{ matrix.neovim }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: tests/parhelion/ci-install.sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make test

  load-time:
    name: Load time
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: tests/parhelion/ci-install.sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make bench

  parser-drift:
    name: Extra queries survive the newest parsers
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PARHELION_TREESITTER_REF: main
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: tests/parhelion/ci-install.sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make test

  commits:
    name: Commit messages
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RANGE: >-
        ${{ github.event_name == 'pull_request'
        && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
        || format('{0}..{1}', github.event.before, github.sha) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: make lintcommit RANGE="$RANGE"
