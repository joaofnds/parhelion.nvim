name: Bug report
description: A group drawn in the wrong color, an option that does nothing, or an error from parhelion.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What looks wrong
      description: What you see, where you see it, and what you expected to see.
    validations:
      required: true
  - type: dropdown
    id: background
    attributes:
      label: Background
      description: Neovim's 'background' when the problem shows.
      options:
        - dark
        - light
        - both
        - only after switching from one to the other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >-
        Save this as repro.lua, set `parhelion` to the path of a clone of parhelion.nvim and the background to the one
        the problem shows in. Put each plugin the problem needs on the runtimepath the same way, its after directory
        included, and set it up as your config does. Then check that `nvim --clean -u repro.lua` shows the problem.
      render: lua
      value: |
        local parhelion = "/path/to/parhelion.nvim"
        vim.opt.runtimepath:prepend(parhelion)
        vim.opt.runtimepath:append(parhelion .. "/after")
        vim.o.background = "dark"
        require("parhelion").setup {}
        vim.cmd.colorscheme "parhelion"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The parhelion.nvim commit that shows the problem, from `git rev-parse --short HEAD` in its clone.
    validations:
      required: true
  - type: textarea
    id: inspect
    attributes:
      label: Highlight groups
      description: The output of `:Inspect` with the cursor on the text that looks wrong.
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: A screenshot of the problem in the reproduction.
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: The terminal or GUI Neovim runs in, and its version.
  - type: textarea
    id: version
    attributes:
      label: Neovim version
      description: The output of `nvim --version`.
      render: text
    validations:
      required: true
